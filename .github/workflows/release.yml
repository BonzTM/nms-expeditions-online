name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install cryptography pyinstaller

      - name: Build Windows exe
        run: >
          pyinstaller
          --onefile
          --console
          --uac-admin
          --collect-submodules cryptography
          --name NMSExpeditionsOnline
          nms_expeditions_online/__main__.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/NMSExpeditionsOnline.exe

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Linux package
        run: |
          mkdir -p nms-expeditions-online
          cp -r nms_expeditions_online nms-expeditions-online/
          cp README.md LICENSE requirements.txt nms-expeditions-online/
          tar czf nms-expeditions-online-linux.tar.gz nms-expeditions-online

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: nms-expeditions-online-linux.tar.gz

  release:
    needs: [build-windows, package-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            windows-exe/NMSExpeditionsOnline.exe
            linux-package/nms-expeditions-online-linux.tar.gz
