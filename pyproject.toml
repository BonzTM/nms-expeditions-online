[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nms-expeditions-online"
version = "1.0.0"
description = "Play old No Man's Sky expeditions online with full multiplayer"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "cryptography",
]

[project.scripts]
nms-expeditions-online = "nms_expeditions_online.app:main"
